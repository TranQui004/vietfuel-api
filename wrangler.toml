name = "vietfuel-api"
main = "backend/src/index.js"
compatibility_date = "2024-04-05"

# Thư mục chứa frontend tĩnh (HTML/CSS/JS)
[assets]
directory = "public"

# Cloudflare KV để lưu trữ JSON cache xăng dầu
[[kv_namespaces]]
binding = "FUEL_CACHE"
id = "SUA_SAU_KHI_TAO_KV_TREN_DASHBOARD"

# Lịch chạy Cron Job (Theo Nghị định 80/2023/NĐ-CP)
# Giờ UTC (Cloudflare dùng UTC), giờ VN = UTC + 7
# 1. Checking (T2-T4): Mỗi 4h
# 2. Hunting (T5 07:30-09:00 UTC = 14:30-16:00 VN): Mỗi 15p
# 3. Maintenance (T6-CN): Mỗi 6h
[triggers]
crons = [
  "0 */4 * * 1-3",
  "*/15 7-9 * * 4",
  "0 */6 * * 5-0"
]
